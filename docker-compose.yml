services:
  postgres:
    image: postgres:16-alpine
    container_name: vakiloncall-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: vakiloncall
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: vakiloncall-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  pgdata:
